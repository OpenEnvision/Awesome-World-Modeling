name: Check awesome list

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-arxiv-duplicates.mjs README.md
      - run: node scripts/check-list-stats.mjs README.md
