name: Validate root website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build the complete research library
        run: npm run build
      - name: Validate research data and browsing logic
        run: npm test
      - name: Ensure published root pages are current
        run: git diff --exit-code -- index.html guide.html resources.html 404.html .nojekyll site/data/library.json
