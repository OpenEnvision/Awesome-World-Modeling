<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" role="img" aria-labelledby="title desc">
  <title id="title">Experience, internal models, and prediction</title>
  <desc id="desc">Experience informs an internal model. The model predicts outcomes, which are tested against experience and used to revise the model. This is a conceptual account of cognitive world modeling.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#171717" stroke-width="1.3"/></marker><marker id="red-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#ce352c" stroke-width="1.3"/></marker></defs>
  <g fill="none" stroke="#171717" stroke-width="1.5" marker-end="url(#arrow)"><path d="M139 76v47"/><path d="M139 197v47"/></g>
  <path d="M230 267h36V52h-35" fill="none" stroke="#ce352c" stroke-width="1.5" marker-end="url(#red-arrow)"/>
  <g stroke-width="1.5"><rect x="48" y="28" width="182" height="48" fill="#fff" stroke="#171717"/><rect x="48" y="124" width="182" height="73" fill="#fcf0ee" stroke="#ce352c"/><rect x="48" y="245" width="182" height="48" fill="#fff" stroke="#171717"/></g>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#171717"><text x="139" y="57" font-size="16">Experience</text><text x="139" y="156" font-size="16">Internal model</text><text x="139" y="179" font-size="12" fill="#62656b">structured expectations</text><text x="139" y="274" font-size="16">Predicted outcomes</text></g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#62656b" text-anchor="middle"><text x="150" y="333">Prediction is tested through experience.</text></g>
  <text x="284" y="162" transform="rotate(-90 284 162)" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ce352c" text-anchor="middle">compare and revise</text>
</svg>
