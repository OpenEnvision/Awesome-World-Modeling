<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" role="img" aria-labelledby="title desc">
  <title id="title">Predict dynamics in representation space</title>
  <desc id="desc">An encoder maps an observation to a latent state z at time t. A predictor, optionally conditioned on an action, predicts the next latent state. Observation reconstruction and a decoder are not required by this pattern.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#171717" stroke-width="1.3"/></marker></defs>
  <g fill="none" stroke="#171717" stroke-width="1.5" marker-end="url(#arrow)"><path d="M150 48v28"/><path d="M150 118v18H87v20"/><path d="M87 198v15h28v20"/><path d="M222 198v15h-37v20"/><path d="M150 277v24"/></g>
  <g fill="#fff" stroke="#171717" stroke-width="1.5"><rect x="65" y="10" width="170" height="38"/><rect x="65" y="77" width="170" height="41"/><rect x="53" y="157" width="68" height="41"/><rect x="180" y="157" width="84" height="41"/><rect x="107" y="302" width="86" height="37"/></g>
  <rect x="65" y="234" width="170" height="43" fill="#fcf0ee" stroke="#ce352c" stroke-width="1.5"/>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#171717"><text x="150" y="35" font-size="15">Observation</text><text x="150" y="103" font-size="15">Encoder</text><text x="87" y="184" font-size="20">z<tspan baseline-shift="sub" font-size="12">t</tspan></text><text x="222" y="183" font-size="14">Action</text><text x="150" y="261" font-size="16">Latent predictor</text><text x="150" y="327" font-size="20">z<tspan baseline-shift="sub" font-size="12">t+1</tspan></text></g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" fill="#62656b"><text x="222" y="148">optional</text><text x="150" y="353">Predict state; decoding is optional.</text></g>
</svg>
